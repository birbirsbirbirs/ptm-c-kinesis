server:
  port: 8081

spring:
  application:
    name: ptm-c-k
  threads:
    virtual:
      enabled: true
  cloud:
    aws:
      endpoint: http://localhost:4566
      region:
        static: us-west-1
      credentials:
        access-key: noop
        secret-key: noop
    stream:
      bindings:
        processOrder-in-0:
          destination: ptm-kinesis
          content-type: application/json
    function:
      definition: processOrder
